name: Daily SEO Report

on:
  schedule:
    - cron: '0 15 * * *'   # 00:00 JST (UTC+9)
  workflow_dispatch:        # 手動実行・動作確認用

# ── 必要な GitHub Secrets ───────────────────────────────────────────────────
# GOOGLE_SERVICE_ACCOUNT_JSON  サービスアカウントのJSON全文
#   → GSC: サイトの「ユーザーを追加」でメールアドレスを閲覧者として登録
#   → GA4: プロパティ設定 > アクセス管理 で閲覧者として追加
# GSC_SITE_URL                 例) https://www.cocomarke.com/
# GA4_PROPERTY_ID              例) 123456789 (プロパティID)
# MIXPANEL_PROJECT_ID          MixpanelのProject ID
# MIXPANEL_API_SECRET          Settings > Service Accounts の secret
# SLACK_WEBHOOK_URL            Slack Incoming Webhook URL（既存Secretを再利用）
# MICROCMS_API_KEY             microCMSコンテンツAPIキー
# ───────────────────────────────────────────────────────────────────────────

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SEO daily report
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          MIXPANEL_PROJECT_ID: ${{ secrets.MIXPANEL_PROJECT_ID }}
          MIXPANEL_API_SECRET: ${{ secrets.MIXPANEL_API_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: node scripts/seo-daily-report.mjs

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-report-${{ github.run_id }}
          path: seo-report.json
          retention-days: 30

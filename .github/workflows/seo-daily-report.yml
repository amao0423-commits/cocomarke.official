name: Daily SEO Report

on:
  schedule:
    - cron: '0 15 * * *'   # 00:00 JST (UTC+9)
  workflow_dispatch:        # 手動実行・動作確認用

# ── 必要な GitHub Secrets ───────────────────────────────────────────────────
# GOOGLE_OAUTH_CLIENT_ID       OAuthクライアントID
# GOOGLE_OAUTH_CLIENT_SECRET   OAuthクライアントシークレット
# GOOGLE_OAUTH_REFRESH_TOKEN   リフレッシュトークン（GSC+GA4スコープ）
# GSC_SITE_URL                 例) https://www.cocomarke.com/
# GA4_PROPERTY_ID              例) 483595220
# SLACK_WEBHOOK_URL            Slack Incoming Webhook URL
# MICROCMS_API_KEY             microCMSコンテンツAPIキー
# ───────────────────────────────────────────────────────────────────────────

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run SEO daily report
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: node scripts/seo-daily-report.mjs

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-report-${{ github.run_id }}
          path: seo-report.json
          retention-days: 30

name: Weekly Article Generation

on:
  # 自動投稿を再開。毎週金曜に1記事を自動生成・公開。
  # 火曜の weekly-seo-research（Slackレポート）を参考に、必要なら手動実行で上書き可。
  schedule:
    - cron: '0 9 * * 5'   # 毎週金曜 18:00 JST 自動公開

  workflow_dispatch:
    inputs:
      keyword:
        description: 'キーワード（weekly-seo-research の Slack レポートから選んで入力）'
        required: false
        default: ''
      article_date:
        description: '投稿日（空欄=当日、形式: YYYY-MM-DD）'
        required: false
        default: ''

permissions:
  contents: read
  models: read   # GitHub Models（無料AI・記事生成）の利用に必要

jobs:
  generate-article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate and publish article
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_WRITE_API_KEY: ${{ secrets.MICROCMS_WRITE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          KEYWORD_OVERRIDE: ${{ github.event.inputs.keyword }}
          ARTICLE_DATE: ${{ github.event.inputs.article_date }}
        run: node scripts/weekly-article.mjs

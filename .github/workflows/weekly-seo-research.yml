name: Weekly SEO Research

on:
  schedule:
    - cron: '0 0 * * 2'   # 09:00 JST Tuesday  (Slackで確認→金曜までに対応)
  workflow_dispatch:       # 手動実行・テスト用

# ── 必要な GitHub Secrets ────────────────────────────────────────────────────
# GOOGLE_SERVICE_ACCOUNT_JSON  GSC 閲覧権限を付与したサービスアカウント JSON
# GSC_SITE_URL                 例) https://www.cocomarke.com/
# ANTHROPIC_API_KEY            Claude 分析用（既存 Secret）
# MICROCMS_API_KEY             記事リスト取得用
# SLACK_WEBHOOK_URL            通知先（既存 Secret）
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SEO research
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/weekly-seo-research.mjs

      - name: Upload research report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-research-${{ github.run_id }}
          path: seo-research-report.json
          retention-days: 60

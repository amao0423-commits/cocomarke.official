<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>お問い合わせを受け付けました｜COCOマーケ（美容サロン向けInstagram集客支援）</title>
<meta name="description" content="お問い合わせを受け付けました。担当より土日祝を除く営業日に順次ご連絡いたします。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0C2B25;--ink-2:#143F37;
    --paper:#F7F9F5;--paper-2:#E9F0E9;
    --brass:#A98443;--brass-lt:#E9DDC2;--muted:#5C6F69;
    --line:rgba(12,43,37,.13);--white:#fff;
    --shadow:0 18px 50px -22px rgba(12,43,37,.45);
    --f-disp:"Shippori Mincho B1",serif;
    --f-body:"Zen Kaku Gothic New",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--f-body);color:var(--ink);background:var(--paper);
    line-height:1.9;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }
  .wrap{width:100%;max-width:640px;margin:0 auto;padding:0 20px}
  .ty{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 0}
  .ty__card{
    width:100%;background:var(--white);border:1px solid var(--line);
    border-radius:22px;box-shadow:var(--shadow);padding:48px 40px 44px;text-align:center;
  }
  .ty__mark{
    width:74px;height:74px;margin:0 auto 26px;border-radius:50%;
    background:var(--paper-2);display:grid;place-items:center;
  }
  .ty__mark svg{width:38px;height:38px;stroke:var(--brass);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ty__lb{
    display:inline-block;font-size:12px;letter-spacing:.18em;color:var(--brass);
    font-weight:700;margin:0 0 14px;
  }
  .ty__h{
    font-family:var(--f-disp);font-weight:800;font-size:25px;line-height:1.5;
    color:var(--ink);margin:0 0 18px;letter-spacing:.01em;
  }
  .ty__p{font-size:14.5px;color:var(--ink-2);margin:0 auto 14px;max-width:460px}
  .ty__note{
    font-size:12.5px;color:var(--muted);background:var(--paper);
    border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:24px auto 0;max-width:480px;text-align:left;
  }
  .ty__note b{color:var(--ink)}
  .ty__actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    padding:14px 26px;border-radius:999px;font-size:14px;font-weight:700;
    text-decoration:none;border:1.5px solid var(--ink);transition:.2s;cursor:pointer;
  }
  .btn--primary{background:var(--ink);color:var(--white)}
  .btn--primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
  .btn--ghost{background:transparent;color:var(--ink)}
  .btn--ghost:hover{background:var(--paper-2)}
  .foot{padding:26px 0 34px;text-align:center;font-size:11.5px;color:var(--muted)}
  .foot a{color:var(--brass);text-decoration:none}
  @media(max-width:520px){
    .ty{padding:34px 0}
    .ty__card{padding:38px 22px 34px;border-radius:18px}
    .ty__h{font-size:21px}
    .btn{width:100%}
  }
</style>
</head>
<body>
  <main class="ty">
    <div class="wrap">
      <div class="ty__card">
        <div class="ty__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <span class="ty__lb">THANK YOU</span>
        <h1 class="ty__h">お問い合わせを<br>受け付けました</h1>
        <p class="ty__p">このたびはCOCOマーケへお問い合わせいただき、ありがとうございます。<br>担当より、土日祝を除く営業日に順次ご連絡いたします。</p>
        <div class="ty__note">
          ご入力のメールアドレス宛に<b>受付確認メール</b>を自動送信しています。<br>
          数分たっても届かない場合は、<b>迷惑メールフォルダ</b>をご確認いただくか、お手数ですが公式サイトのお問い合わせフォームより再度ご連絡ください。
        </div>
        <div class="ty__actions">
          <a class="btn btn--primary" href="https://www.cocomarke.com/">公式サイトへ</a>
          <a class="btn btn--ghost" href="/lp/beauty">ページに戻る</a>
        </div>
      </div>
    </div>
  </main>
  <footer class="foot">
    COCOマーケ（株式会社ホットセラー）　<a href="https://www.cocomarke.com/">www.cocomarke.com</a>
  </footer>
  <script>
  /* コンバージョン計測：CAPIと同一 event_id で Meta Pixel Lead を発火（重複排除） */
  (function(){
    try{
      var eid='';
      try{ eid=sessionStorage.getItem('beauty_eid')||''; sessionStorage.removeItem('beauty_eid'); }catch(e){}
      if(window.fbq){ window.fbq('track','Lead',{content_name:'beauty-quote'}, eid?{eventID:eid}:undefined); }
      if(window.dataLayer){ window.dataLayer.push({event:'beauty_lead', event_id:eid}); }
    }catch(e){}
  })();
  </script>
</body>
</html>
